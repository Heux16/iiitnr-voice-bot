# Google Gemini API (Chat, Reranker, Rewrite, dan Embedding)
# Cukup satu API key dari Google AI Studio: https://aistudio.google.com/
GEMINI_API_KEY = "your_google_gemini_api_key_here"

# Model Google Gemini
LLM_MODEL = "gemini-2.5-flash"
UTILITY_MODEL = "gemini-2.5-flash"

# Mode aplikasi:
# public   = untuk mahasiswa, hanya Tanya Jawab
# operator = UI internal lengkap untuk admin/pengembang
APP_MODE = "public"

# Rate limit per sesi Streamlit (public mode)
PUBLIC_RATE_LIMIT = 20
PUBLIC_RATE_WINDOW_SECONDS = 3600
